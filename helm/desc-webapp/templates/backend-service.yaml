# Gateway ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "desc-webapp.fullname" . }}-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "desc-webapp.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "desc-webapp.name" . }}-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "desc-webapp.name" . }}-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
