apiVersion: v1
kind: Service
metadata:
  name: {{ include "desc-webapp.fullname" . }}-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "desc-webapp.labels" . | nindent 4 }}
    {{- include "desc-webapp.frontend.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "desc-webapp.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
