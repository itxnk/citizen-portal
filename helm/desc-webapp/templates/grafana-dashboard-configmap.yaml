{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "desc-webapp.fullname" . }}-grafana-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "desc-webapp.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  desc-microservices.json: |-
    {
      "annotations": { "list": [] },
      "description": "DESC Cloud-Native Platform — microservices metrics",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 100 },
                { "color": "red", "value": 500 }
              ]},
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 1,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "title": "Gateway Request Rate",
          "type": "stat",
          "targets": [{ "expr": "sum(rate(gateway_requests_total[2m]))", "legendFormat": "req/s", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 1 },
                { "color": "red", "value": 5 }
              ]},
              "unit": "percent"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "id": 2,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "title": "Gateway Error Rate (5xx %)",
          "type": "stat",
          "targets": [{ "expr": "100 * sum(rate(gateway_requests_total{status=~\"5..\"}[2m])) / (sum(rate(gateway_requests_total[2m])) > 0) or vector(0)", "legendFormat": "%", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.1 },
                { "color": "red", "value": 0.5 }
              ]},
              "unit": "s"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "id": 3,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "title": "Upstream p95 Latency",
          "type": "stat",
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(gateway_upstream_latency_seconds_bucket[2m])) by (le))", "legendFormat": "p95", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "yellow", "value": 50 },
                { "color": "green", "value": 80 }
              ]},
              "unit": "percent"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "id": 4,
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "title": "Records Cache Hit Ratio",
          "type": "stat",
          "targets": [{ "expr": "100 * rate(cache_hits_total[2m]) / ((rate(cache_hits_total[2m]) + rate(cache_misses_total[2m])) > 0) or vector(0)", "legendFormat": "hit %", "refId": "A" }]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 101,
          "title": "Gateway",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 10,
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "Request Rate by Status",
          "type": "timeseries",
          "targets": [
            { "expr": "sum(rate(gateway_requests_total{status=~\"2..\"}[1m]))", "legendFormat": "2xx", "refId": "A" },
            { "expr": "sum(rate(gateway_requests_total{status=~\"4..\"}[1m]))", "legendFormat": "4xx", "refId": "B" },
            { "expr": "sum(rate(gateway_requests_total{status=~\"5..\"}[1m]))", "legendFormat": "5xx", "refId": "C" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2, "fillOpacity": 5 } } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 11,
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "Upstream Latency p50 / p95 / p99 by Service",
          "type": "timeseries",
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(gateway_upstream_latency_seconds_bucket[2m])) by (le, service))", "legendFormat": "p50 {{service}}", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum(rate(gateway_upstream_latency_seconds_bucket[2m])) by (le, service))", "legendFormat": "p95 {{service}}", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum(rate(gateway_upstream_latency_seconds_bucket[2m])) by (le, service))", "legendFormat": "p99 {{service}}", "refId": "C" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 102,
          "title": "Business Metrics",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": { "unit": "ops", "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "id": 20,
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "Creation Rate — Users / Records / Notifications",
          "type": "timeseries",
          "targets": [
            { "expr": "rate(users_created_total[2m])", "legendFormat": "users", "refId": "A" },
            { "expr": "rate(records_created_total[2m])", "legendFormat": "records", "refId": "B" },
            { "expr": "sum(rate(notifications_sent_total[2m]))", "legendFormat": "notifications", "refId": "C" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": { "unit": "ops", "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "id": 21,
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "Notifications Sent by Type",
          "type": "timeseries",
          "targets": [{ "expr": "rate(notifications_sent_total[2m])", "legendFormat": "{{type}}", "refId": "A" }]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "id": 103,
          "title": "Database & Cache",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2, "fillOpacity": 5 } } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "id": 30,
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "DB Query Latency p95 by Service & Operation",
          "type": "timeseries",
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket[2m])) by (le, job, operation))", "legendFormat": "{{job}} {{operation}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": { "unit": "ops", "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "id": 31,
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "Records Cache — Hits vs Misses",
          "type": "timeseries",
          "targets": [
            { "expr": "rate(cache_hits_total[1m])", "legendFormat": "hits", "refId": "A" },
            { "expr": "rate(cache_misses_total[1m])", "legendFormat": "misses", "refId": "B" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 32 },
          "id": 104,
          "title": "Redis & Frontend",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2, "fillOpacity": 5 } } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 33 },
          "id": 40,
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "Redis Publish Latency p50 / p95",
          "type": "timeseries",
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(redis_publish_latency_seconds_bucket[2m])) by (le))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum(rate(redis_publish_latency_seconds_bucket[2m])) by (le))", "legendFormat": "p95", "refId": "B" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 33 },
          "id": 41,
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "title": "Frontend Request Rate by Path",
          "type": "timeseries",
          "targets": [{ "expr": "rate(frontend_requests_total[1m])", "legendFormat": "{{path}} ({{status}})", "refId": "A" }]
        }
      ],
      "refresh": "15s",
      "schemaVersion": 38,
      "tags": ["desc", "microservices", "cloud-native"],
      "templating": {
        "list": [{
          "hide": 2,
          "name": "DS_PROMETHEUS",
          "query": "prometheus",
          "refresh": 1,
          "type": "datasource"
        }]
      },
      "time": { "from": "now-30m", "to": "now" },
      "timezone": "browser",
      "title": "DESC — Microservices Platform",
      "uid": "desc-microservices-v1",
      "version": 1
    }
{{- end }}
