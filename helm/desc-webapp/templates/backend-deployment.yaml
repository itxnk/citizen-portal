# Gateway Service Deployment
# Routes all /api/* traffic to the three downstream microservices.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "desc-webapp.fullname" . }}-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "desc-webapp.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "desc-webapp.name" . }}-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "desc-webapp.name" . }}-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "desc-webapp.name" . }}-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.gateway.port | quote }}
    spec:
      serviceAccountName: {{ include "desc-webapp.fullname" . }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: gateway
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: USER_SERVICE_URL
              value: {{ .Values.gateway.env.USER_SERVICE_URL | quote }}
            - name: RECORDS_SERVICE_URL
              value: {{ .Values.gateway.env.RECORDS_SERVICE_URL | quote }}
            - name: NOTIFICATION_SERVICE_URL
              value: {{ .Values.gateway.env.NOTIFICATION_SERVICE_URL | quote }}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      terminationGracePeriodSeconds: 30
